services:
  postgres:
    container_name: "${PG_DOCKER_NAME:-pgui-postgres}"
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    # initdb sizes max_connections and shared_buffers to the shared memory it finds, and docker
    # gives a container 64 MB, which leaves a server allowing 20 connections.
    shm_size: 256mb
    ports:
      - "127.0.0.1:5432:5432"
    # postgres 18 keeps its data in a directory per major version under /var/lib/postgresql.
    volumes:
      - "${PG_VOLUME_DIR:-./volume}:/var/lib/postgresql"
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres"]
      interval: 5s
      timeout: 3s
      retries: 10
